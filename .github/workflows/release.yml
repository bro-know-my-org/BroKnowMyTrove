name: GitHub Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Validate version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 .github/scripts/prepare-release.py --validate-only
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  checks:
    name: Rust checks
    needs: version
    uses: ./.github/workflows/check.yml
    with:
      release-tag: ${{ needs.version.outputs.tag }}

  build:
    name: Test and build (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - name: Preserve LF in tagged build inputs
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.version.outputs.tag }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libssl-dev libgtk-3-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev
      - name: Verify pinned libsodium inputs
        working-directory: vendor/libsodium
        run: sha256sum --check SHA256SUMS
      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: ${{ matrix.target }}
      - name: Set release version
        run: |
          python .github/scripts/prepare-release.py
          cargo update --workspace
      - name: Test workspace
        run: cargo test --workspace --locked --target "$TARGET"
      - name: Test CLI without GUI
        run: cargo test -p vault-cli --no-default-features --locked --target "$TARGET"
      - name: Build release binary
        run: cargo build --release --locked -p vault-cli --bin bkmt --target "$TARGET"
      - name: Smoke test release binary
        run: |
          binary="target/$TARGET/release/bkmt"
          if [[ "$RUNNER_OS" == 'Windows' ]]; then binary="$binary.exe"; fi
          "$binary" --version
          "$binary" --help
      - name: Include font and libsodium licenses
        run: |
          license_dir="target/$TARGET/release/LICENSES"
          mkdir -p "$license_dir"
          cp assets/fonts/LICENSE-*.txt "$license_dir/"
          tar -xOf vendor/libsodium/LATEST.tar.gz libsodium-stable/LICENSE > "$license_dir/LICENSE-libsodium.txt"
      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf "dist/bkmt-$RELEASE_TAG-$TARGET.tar.gz" -C "target/$TARGET/release" bkmt LICENSES
      - name: Package Windows binary
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          cd "target/$TARGET/release"
          7z a "$GITHUB_WORKSPACE/dist/bkmt-$RELEASE_TAG-$TARGET.zip" bkmt.exe LICENSES
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  release:
    name: Publish GitHub Release
    needs: [version, checks, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Package all-platform portable bundle
        shell: bash
        run: |
          set -euo pipefail
          archive_dir="$PWD/dist"
          bundle_dir=$(mktemp -d)
          while read -r target arch system binary; do
            destination="$bundle_dir/$arch/$system"
            mkdir -p "$destination"
            if [[ "$system" == 'windows' ]]; then
              unzip -p "$archive_dir/bkmt-$RELEASE_TAG-$target.zip" "$binary" > "$destination/$binary"
              unzip -q "$archive_dir/bkmt-$RELEASE_TAG-$target.zip" 'LICENSES/*' -d "$destination"
            else
              tar -xzf "$archive_dir/bkmt-$RELEASE_TAG-$target.tar.gz" -C "$destination" "$binary" LICENSES
            fi
            test -s "$destination/$binary"
            chmod 755 "$destination/$binary"
          done <<'TARGETS'
          x86_64-unknown-linux-gnu x64 linux bkmt
          aarch64-unknown-linux-gnu arm64 linux bkmt
          x86_64-pc-windows-msvc x64 windows bkmt.exe
          aarch64-pc-windows-msvc arm64 windows bkmt.exe
          x86_64-apple-darwin x64 macos bkmt
          aarch64-apple-darwin arm64 macos bkmt
          TARGETS
          cd "$bundle_dir"
          zip -q -9 -r "$archive_dir/bkmt-$RELEASE_TAG-all-platforms.zip" x64 arm64
      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS.txt
      - name: Upload all-platform portable bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bkmt-all-platforms
          path: dist/bkmt-*-all-platforms.zip
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Create release and upload assets
        shell: bash
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" == 'false' ]]; then
              assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
              for file in dist/*; do
                if ! grep -Fxq "$(basename "$file")" <<< "$assets"; then
                  echo "::error::Published release is missing $(basename "$file"); inspect it before retrying."
                  exit 1
                fi
              done
              echo 'Release is already published with all expected assets.'
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes \
              --title "$RELEASE_TAG" --prerelease="$PRERELEASE"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
