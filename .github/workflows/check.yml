name: Rust checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned libsodium inputs
        working-directory: vendor/libsodium
        run: sha256sum --check SHA256SUMS
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build and test independent CLI
        run: |
          cargo build --locked -p vault-cli
          cargo test --locked -p vault-cli
          env -u DISPLAY -u WAYLAND_DISPLAY cargo run --locked -p vault-cli -- --help
          env -u DISPLAY -u WAYLAND_DISPLAY cargo run --locked -p vault-cli -- --version
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Check workspace
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cargo build --locked --workspace
