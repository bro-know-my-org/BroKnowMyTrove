name: Rust checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify pinned libsodium inputs
        working-directory: vendor/libsodium
        run: sha256sum --check SHA256SUMS
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build and test CLI-only configuration
        run: |
          cargo build --locked -p vault-cli --no-default-features
          cargo test --locked -p vault-cli --no-default-features
          env -u DISPLAY -u WAYLAND_DISPLAY target/debug/bkmt --help
          env -u DISPLAY -u WAYLAND_DISPLAY target/debug/bkmt --version
          cargo build --locked -p vault-cli --no-default-features --example password-probe
          python3 scripts/test-terminal.py target/debug/examples/password-probe
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri xvfb xdotool
      - name: Check workspace
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cargo build --locked --workspace
      - name: Verify unified bkmt entrypoint
        run: |
          env -u DISPLAY -u WAYLAND_DISPLAY target/debug/bkmt --help
          env -u DISPLAY -u WAYLAND_DISPLAY target/debug/bkmt --version
          python3 scripts/test-cli.py target/debug/bkmt
          python3 scripts/test-management.py target/debug/bkmt
          bash scripts/smoke-gui.sh
