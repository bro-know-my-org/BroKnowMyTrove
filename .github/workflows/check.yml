name: Rust checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: Release tag to use as the build version
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  windows:
    if: inputs.release-tag == ''
    name: Windows (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve LF in build inputs
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify pinned libsodium inputs
        working-directory: vendor/libsodium
        run: sha256sum --check SHA256SUMS
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: windows-${{ matrix.os }}
          cache-on-failure: true
          save-if: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
      - name: Test workspace and CLI-only configuration
        run: |
          cargo test --release --workspace --exclude vault-gui --locked
          cargo test --release -p vault-gui --locked -- --test-threads=1
          cargo test --release -p vault-cli --no-default-features --locked
      - name: Build and smoke test unified executable
        run: |
          cargo build --release --locked -p vault-cli --bin bkmt
          target/release/bkmt.exe --version
          target/release/bkmt.exe --help

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release-tag != '' && format('refs/tags/{0}', inputs.release-tag) || github.ref }}
      - name: Verify pinned libsodium inputs
        working-directory: vendor/libsodium
        run: sha256sum --check SHA256SUMS
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
      - name: Set release version
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          python3 .github/scripts/prepare-release.py
          cargo update --workspace
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build and test CLI-only configuration
        run: |
          cargo build --locked -p vault-cli --no-default-features
          cargo test --locked -p vault-cli --no-default-features
          env -u DISPLAY -u WAYLAND_DISPLAY target/debug/bkmt --help
          env -u DISPLAY -u WAYLAND_DISPLAY target/debug/bkmt --version
          cargo build --locked -p vault-cli --no-default-features --example password-probe
          python3 scripts/test-terminal.py target/debug/examples/password-probe
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri xvfb xdotool
      - name: Check workspace
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cargo build --locked --workspace
      - name: Verify unified bkmt entrypoint
        run: |
          env -u DISPLAY -u WAYLAND_DISPLAY target/debug/bkmt --help
          env -u DISPLAY -u WAYLAND_DISPLAY target/debug/bkmt --version
          python3 scripts/test-cli.py target/debug/bkmt
          python3 scripts/test-management.py target/debug/bkmt
      - name: Smoke test GUI
        env:
          VALIDATION_COMMIT: ${{ github.workflow_sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$VALIDATION_COMMIT"
          git show "$VALIDATION_COMMIT:scripts/smoke-gui.sh" > "$RUNNER_TEMP/bkmt-smoke-gui.sh"
          if ! bash "$RUNNER_TEMP/bkmt-smoke-gui.sh"; then
            cat /tmp/bkm-gui.*/gui.err /tmp/bkm-gui.*/xvfb.err
            exit 1
          fi
      - name: Upload GUI smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gui-smoke-${{ github.run_id }}
          path: /tmp/bkm-gui.*/
          if-no-files-found: ignore
          retention-days: 7
