<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>兄弟懂我的保险箱 · 图标方向</title>
  <link rel="icon" type="image/svg+xml" href="./trove-icon.svg" />
  <style>
    :root{color-scheme:dark;font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;color:#eeeede;background:#090d0b;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0}button,a{font:inherit;color:inherit}a{text-decoration:none}
    main{width:min(1040px,calc(100% - 48px));margin:auto;padding:36px 0 40px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:64px}
    header p{font-size:14px;margin:0}header a{color:#c3cfc5;font-size:12px;padding:8px}
    h1{font-size:clamp(28px,5vw,44px);letter-spacing:-.04em;margin:0 0 36px;font-weight:600}
    .directions{display:grid;grid-template-columns:1fr 1fr;gap:56px}
    article{min-width:0}figure{margin:0;display:grid;place-items:center;padding:28px 0 48px;border-bottom:1px solid #ffffff24}
    figure img{width:min(72%,256px);height:auto;display:block}
    h2{font-size:20px;font-weight:500;margin:24px 0 8px}article p{font-size:13px;color:#c3cfc5;margin:0;line-height:1.8;max-width:35ch}
    .sizes{display:flex;align-items:center;gap:20px;margin-top:28px;height:48px}.sizes img{display:block}
    .reference{display:flex;align-items:center;gap:14px;margin-top:56px;padding-top:24px;border-top:1px solid #ffffff24;color:#b9c7bd;font-size:12px}
    .reference img{width:32px;height:32px}.reference span{margin-left:auto}
    a{transition:color 200ms ease-out,scale 200ms ease-out}a:hover{color:white}a:active{scale:.98}a:focus-visible{outline:2px solid #ffffffe0;outline-offset:4px}
    @media(max-width:600px){main{width:calc(100% - 32px);padding-top:20px}header{margin-bottom:36px}.directions{gap:24px}figure{padding:12px 0 28px}figure img{width:100%;max-width:180px}h2{font-size:17px}.sizes{gap:12px}.reference{flex-wrap:wrap;gap:10px}.reference span{margin-left:0;flex-basis:100%}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main>
    <header><p>兄弟懂我的保险箱 / BKMT</p><a href="./">返回产品页 ↗</a></header>
    <h1>把「珍藏」画出来。</h1>
    <div class="directions">
      <article>
        <figure><img src="./trove-folder-concept.svg" width="256" height="256" alt="藏宝文件夹：浅色文件夹中央藏着一枚金色菱形" /></figure>
        <h2>01　藏宝文件夹</h2>
        <p>文件夹里藏着一颗小宝石。<br>直观，也能接上现在的 GUI 动画。</p>
        <div class="sizes" aria-label="不同尺寸预览"><img src="./trove-folder-concept.svg" width="24" height="24" alt="24 像素" /><img src="./trove-folder-concept.svg" width="32" height="32" alt="32 像素" /><img src="./trove-folder-concept.svg" width="48" height="48" alt="48 像素" /></div>
      </article>
      <article>
        <figure><img src="./trove-casket-concept.svg" width="256" height="256" alt="匣中微光：立体小匣的开口间露出金色微光" /></figure>
        <h2>02　匣中微光 · 已选</h2>
        <p>几片折面围住一点微光。<br>更抽象，突出「属于自己的珍藏」。</p>
        <div class="sizes" aria-label="不同尺寸预览"><img src="./trove-casket-concept.svg" width="24" height="24" alt="24 像素" /><img src="./trove-casket-concept.svg" width="32" height="32" alt="32 像素" /><img src="./trove-casket-concept.svg" width="48" height="48" alt="48 像素" /></div>
      </article>
    </div>
    <div class="reference"><img src="./trove-folded-t-concept.svg" width="32" height="32" alt="之前的折叠 T" />之前的 T<span>下排为 24 / 32 / 48 px 实际尺寸</span></div>
  </main>
</body>
</html>
