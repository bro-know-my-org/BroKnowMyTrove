[workspace]
members = ["crates/vault-core", "crates/vault-cli", "crates/vault-gui", "crates/vault-platform", "crates/vault-i18n"]
default-members = ["crates/vault-core", "crates/vault-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
vault-core = { path = "crates/vault-core" }
vault-i18n = { path = "crates/vault-i18n" }
clap = "=4.6.7"
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "=0.17.2"
alkali = { version = "=0.3.0", default-features = false, features = ["std"] }
libsodium-sys-stable = "=1.24.3"
zeroize = "=1.9.1"
unicode-normalization = "=0.1.25"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
hex = "=0.4.3"
tempfile = "=3.27.0"
crossterm = { version = "=0.29.0", features = ["use-dev-tty"] }
unicode-segmentation = "=1.13.3"
unicode-casefold = "=0.2.0"
libc = "=0.2.190"
fs2 = "=0.4.3"
rustix = { version = "=1.1.5", features = ["fs"] }
same-file = "=1.0.6"
ctrlc = "=3.5.1"
vault-platform = { path = "crates/vault-platform" }
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
