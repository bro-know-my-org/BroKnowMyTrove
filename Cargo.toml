[workspace]
members = ["crates/vault-core", "crates/vault-cli", "crates/vault-gui"]
default-members = ["crates/vault-core", "crates/vault-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
vault-core = { path = "crates/vault-core" }
clap = "=4.6.7"
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
