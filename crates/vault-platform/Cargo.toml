[package]
name = "vault-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
fs2.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console", "Win32_Security_Authorization", "Win32_System_SystemServices"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
