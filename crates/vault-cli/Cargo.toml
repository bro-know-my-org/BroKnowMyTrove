[package]
name = "vault-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "bkmt"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:vault-gui", "dep:vault-platform"]

[dependencies]
clap.workspace = true
vault-core.workspace = true
vault-i18n.workspace = true
crossterm.workspace = true
unicode-segmentation.workspace = true
zeroize.workspace = true
serde_json.workspace = true
ctrlc.workspace = true
vault-gui = { path = "../vault-gui", optional = true }
vault-platform = { workspace = true, optional = true }

[lints]
workspace = true
